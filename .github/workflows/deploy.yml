name: Deploy

# Auto-deploy on every push to main: SSH into the server and run deploy.sh.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # allows manual run from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
          set -e
          DIR="$HOME/circus-buzzer-v2"
          if [ -d "$DIR/.git" ]; then
            cd "$DIR"
            git fetch origin
            git reset --hard origin/main
          else
            git clone https://github.com/MaksimL1021/victorina.git "$DIR"
            cd "$DIR"
          fi
          npm install
          pkill -f "node server.js" || echo "No running process found."
          sleep 1
          nohup node server.js > buzzer.log 2>&1 &
          disown
          sleep 2
          echo "==> buzzer.log:"
          cat buzzer.log
          REMOTE
